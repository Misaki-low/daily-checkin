name: 雨云每日签到

on:
  schedule:
    # 每天北京时间 09:05（UTC 01:05）
    - cron: '5 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r rainyun/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 执行签到
        working-directory: rainyun
        env:
          RAINYUN_COOKIES: ${{ secrets.RAINYUN_COOKIES }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
        run: python main.py
